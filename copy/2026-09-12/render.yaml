# Render Blueprint — SEO Scan auto-payment service
# Deploy: Render Dashboard → New → Blueprint, or push this repo to a GitHub
# repo and connect it. Backend service exposes the webhook + landing page.

services:
  - type: web
    name: seo-scan
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/Dockerfile
    healthCheckPath: /health
    envVars:
      # 以下全部都喺 Render Dashboard 填入（對應你 /opt/data/seo-audit-business/secrets.env 嘅值）
      - key: STRIPE_SECRET_KEY
        sync: false        # 手動填，唔入庫
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_BACKEND
        value: smtp_ssl
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: YOUR_EMAIL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: PUBLIC_URL
        value: https://seo-scan.onrender.com   # 填你實際 render URL